name: DeGameTV Quality Gate
'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, build, accessibility and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      DEGAMETV_E2E_CREATOR_EMAIL: ${{ secrets.DEGAMETV_E2E_CREATOR_EMAIL }}
      DEGAMETV_E2E_CREATOR_PASSWORD: ${{ secrets.DEGAMETV_E2E_CREATOR_PASSWORD }}
      DEGAMETV_E2E_ADMIN_EMAIL: ${{ secrets.DEGAMETV_E2E_ADMIN_EMAIL }}
      DEGAMETV_E2E_ADMIN_PASSWORD: ${{ secrets.DEGAMETV_E2E_ADMIN_PASSWORD }}
      DEGAMETV_E2E_IDENTITY_VERIFICATION_ID: ${{ secrets.DEGAMETV_E2E_IDENTITY_VERIFICATION_ID }}
      DEGAMETV_E2E_STOREFRONT_HOST: ${{ secrets.DEGAMETV_E2E_STOREFRONT_HOST }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Accessibility audit
        run: npm run test:a11y
      - name: Playwright end-to-end suite
        run: npm run test:e2e

  edge-functions:
    name: Edge function type checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies for Deno npm specifiers
        run: npm ci
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check event, payment, media and Phase 2 functions
        run: |
          deno check \
            supabase/functions/process-live-payment/index.ts \
            supabase/functions/payment-webhook/index.ts \
            supabase/functions/payment-status/index.ts \
            supabase/functions/manage-event-invites/index.ts \
            supabase/functions/manage-event-settings/index.ts \
            supabase/functions/process-event-contribution/index.ts \
            supabase/functions/dispatch-event-notifications/index.ts \
            supabase/functions/process-refund/index.ts \
            supabase/functions/manage-event/index.ts \
            supabase/functions/authorize-live-playback/index.ts \
            supabase/functions/validate-watch-code/index.ts \
            supabase/functions/get-playback-url/index.ts \
            supabase/functions/record-watch-heartbeat/index.ts \
            supabase/functions/admin-provider-control/index.ts \
            supabase/functions/creator-onboarding/index.ts \
            supabase/functions/admin-creator-verification/index.ts \
            supabase/functions/domain-control/index.ts \
            supabase/functions/runtime-config/index.ts \
            supabase/functions/media-ingest-control/index.ts \
            supabase/functions/media-ingest-worker/index.ts

  database-security:
    name: Supabase migration and SQL security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: dxijsbbdtwtbwdaajiyn
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify SQL security test files
        run: |
          test -n "$(find supabase/tests -maxdepth 1 -type f -name 'phase1_*.sql' -print -quit)"
          test -f supabase/tests/phase2_creator_os_security.sql
          test -f supabase/tests/pass4b_release_gate_security.sql
      - name: Run linked database security tests when credentials exist
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            supabase test db --db-url "$SUPABASE_DB_URL"
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
            supabase test db --linked
          else
            echo "Database tests skipped: configure SUPABASE_DB_URL or SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD."
          fi
