name: DeGameTV Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: degametv-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, build, accessibility and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility audit
        run: npm run test:a11y

      - name: Creator OS browser acceptance tests
        run: npm run test:e2e

  edge-functions:
    name: Edge function type checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check event and payment functions
        run: |
          deno check \
            supabase/functions/process-live-payment/index.ts \
            supabase/functions/payment-webhook/index.ts \
            supabase/functions/payment-status/index.ts \
            supabase/functions/manage-event-invites/index.ts \
            supabase/functions/manage-event-settings/index.ts \
            supabase/functions/process-event-contribution/index.ts \
            supabase/functions/dispatch-event-notifications/index.ts \
            supabase/functions/process-refund/index.ts \
            supabase/functions/manage-event/index.ts \
            supabase/functions/authorize-live-playback/index.ts
